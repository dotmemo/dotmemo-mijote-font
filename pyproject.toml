[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "dotmemo-mijote"
version = "0.1.0"
description = "Build tools for the unreleased dotmemo mijote typeface"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE-MIT"]
requires-python = ">=3.11,<3.14"
dependencies = [
  "fonttools==4.68.0",
  "skia-pathops==0.9.2",
  "brotli==1.2.1",
  "uharfbuzz==0.57.0",
  "Pillow==13.0.0",
]

[dependency-groups]
dev = ["pytest==9.0.2", "ruff==0.17.6", "PyYAML==6.0.3"]

[project.scripts]
dotmemo-mijote = "dotmemo_mijote.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dotmemo_mijote"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["tools/regenerate_drawings.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
