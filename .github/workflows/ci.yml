name: Font build and regressions
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.12.10'
          python-version: ${{ matrix.python }}
          enable-cache: false
      - run: uv sync --locked
      - run: make lint
      - run: make check
      - run: make test
      - run: uv run --locked python tools/check_repository.py
      # Deliberately no publish, Pages deployment, package upload or release step.
